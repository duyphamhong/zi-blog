name: Deploy to Hostinger VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zi-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_NAME: ${{ secrets.SEED_ADMIN_NAME }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_SERVER_URL PAYLOAD_SECRET POSTGRES_DB POSTGRES_PASSWORD POSTGRES_USER SEED_ADMIN_EMAIL SEED_ADMIN_NAME SEED_ADMIN_PASSWORD VPS_HOST VPS_SSH_PRIVATE_KEY VPS_SSH_USER; do
            test -n "${!name}" || { echo "Missing required production secret: $name"; exit 1; }
          done
          test "${#PAYLOAD_SECRET}" -ge 32 || { echo 'PAYLOAD_SECRET must be at least 32 characters.'; exit 1; }
          [[ "$NEXT_PUBLIC_SERVER_URL" =~ ^https:// ]] || { echo 'NEXT_PUBLIC_SERVER_URL must use HTTPS.'; exit 1; }

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_SSH_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -q \
              -P "$VPS_SSH_KEY_PASSPHRASE" \
              -N '' \
              -f ~/.ssh/id_ed25519
          fi
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Trust VPS host key
        run: |
          set -euo pipefail
          if [ -n "$VPS_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Create release and production environment bundles
        run: |
          set -euo pipefail
          RELEASE_ARCHIVE="$RUNNER_TEMP/zi-blog-${DEPLOY_SHA}.tgz"
          ENV_FILE="$RUNNER_TEMP/zi-blog.env.production"
          tar --exclude=.git --exclude=.github --exclude=.next --exclude=node_modules --exclude=apps/web/.next --exclude=apps/web/node_modules -czf "$RELEASE_ARCHIVE" .
          python3 - "$ENV_FILE" <<'PY'
          import os
          import sys
          from urllib.parse import quote

          values = {
              'DATABASE_URI': 'postgresql://{user}:{password}@postgres:5432/{database}'.format(
                  user=os.environ['POSTGRES_USER'],
                  password=quote(os.environ['POSTGRES_PASSWORD'], safe=''),
                  database=os.environ['POSTGRES_DB'],
              ),
              'ENABLE_SEED_SAMPLE_CONTENT': 'false',
              'LEGACY_CONTENT_LOCALE': 'en',
              'NEXT_PUBLIC_SERVER_URL': os.environ['NEXT_PUBLIC_SERVER_URL'],
              'NODE_ENV': 'production',
              'PAYLOAD_SECRET': os.environ['PAYLOAD_SECRET'],
              'POSTGRES_DB': os.environ['POSTGRES_DB'],
              'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
              'POSTGRES_USER': os.environ['POSTGRES_USER'],
              'SEED_ADMIN_EMAIL': os.environ['SEED_ADMIN_EMAIL'],
              'SEED_ADMIN_NAME': os.environ['SEED_ADMIN_NAME'],
              'SEED_ADMIN_PASSWORD': os.environ['SEED_ADMIN_PASSWORD'],
          }

          def quote(value):
              return "'{}'".format(value.replace("'", "''"))

          with open(sys.argv[1], 'w', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={quote(value)}\n')
          PY
          echo "RELEASE_ARCHIVE=$RELEASE_ARCHIVE" >> "$GITHUB_ENV"
          echo "PRODUCTION_ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"

      - name: Upload release bundle
        run: |
          set -euo pipefail
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/zi-blog}"
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_SSH_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/releases'"
          scp -P "${VPS_SSH_PORT:-22}" "$RELEASE_ARCHIVE" "$VPS_SSH_USER@$VPS_HOST:$DEPLOY_PATH/releases/$DEPLOY_SHA.tgz"
          scp -P "${VPS_SSH_PORT:-22}" "$PRODUCTION_ENV_FILE" "$VPS_SSH_USER@$VPS_HOST:$DEPLOY_PATH/releases/$DEPLOY_SHA.env.production"

      - name: Deploy and migrate on VPS
        run: |
          set -euo pipefail
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/zi-blog}"
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_SSH_USER@$VPS_HOST" "export DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA'; bash -s" <<'EOF'
          set -euo pipefail

          RELEASE_DIR="$DEPLOY_PATH/releases/$DEPLOY_SHA"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$DEPLOY_PATH/releases/$DEPLOY_SHA.tgz" -C "$RELEASE_DIR"
          rm -f "$DEPLOY_PATH/releases/$DEPLOY_SHA.tgz"
          mv "$DEPLOY_PATH/releases/$DEPLOY_SHA.env.production" "$RELEASE_DIR/.env.production"

          cd "$RELEASE_DIR"
          INGRESS_NETWORK="${PUBLIC_INGRESS_NETWORK:-public-ingress}"
          if ! docker network inspect "$INGRESS_NETWORK" > /dev/null 2>&1; then
            docker network create "$INGRESS_NETWORK"
          fi

          docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres
          # The remote shell reads this deployment script from stdin. Keep the
          # migration container from consuming the commands that follow it.
          docker compose --env-file .env.production -f docker-compose.prod.yml \
            --profile migration run --rm --build -T migrate < /dev/null
          echo 'Migration completed; starting the Zi-Blog web service.'
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans web

          WEB_CONTAINER_ID="$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -q web)"
          test -n "$WEB_CONTAINER_ID"

          for attempt in $(seq 1 30); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$WEB_CONTAINER_ID")"
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color web
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' "$WEB_CONTAINER_ID")" = healthy
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T web node -e "fetch('http://127.0.0.1:3000/api/health/ready').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"

          # A health check at startup alone cannot detect a process that exits
          # immediately afterward. Confirm the service remains healthy.
          for attempt in $(seq 1 3); do
            sleep 5
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}stopped{{end}}' "$WEB_CONTAINER_ID")"
            if [ "$status" != healthy ]; then
              docker compose --env-file .env.production -f docker-compose.prod.yml ps --all
              docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color web
              exit 1
            fi
          done

          GATEWAY_CONTAINER_ID="$(docker ps -q --filter 'label=com.docker.compose.project=nginx-gateway' --filter 'label=com.docker.compose.service=nginx' | head -n 1)"
          test -n "$GATEWAY_CONTAINER_ID" || { echo 'Nginx gateway container was not found.'; exit 1; }
          docker network connect "$INGRESS_NETWORK" "$GATEWAY_CONTAINER_ID" 2> /dev/null || true

          verify_gateway_upstream() {
            docker exec "$GATEWAY_CONTAINER_ID" getent hosts zi-blog-web
            docker exec "$GATEWAY_CONTAINER_ID" wget -q -T 10 -O /dev/null http://zi-blog-web:3000/api/health/ready
          }

          if ! verify_gateway_upstream; then
            # Restore the stable Docker DNS alias if a prior deployment left the
            # web container attached without it, then allow Nginx's resolver to refresh.
            docker network disconnect "$INGRESS_NETWORK" "$WEB_CONTAINER_ID" 2> /dev/null || true
            docker network connect --alias zi-blog-web "$INGRESS_NETWORK" "$WEB_CONTAINER_ID"
            for attempt in $(seq 1 6); do
              if verify_gateway_upstream; then
                break
              fi
              sleep 5
            done
          fi
          verify_gateway_upstream

          # The gateway resolves upstream DNS itself. Reload it after the web
          # container is attached so an old resolver cache cannot keep serving 502.
          docker exec "$GATEWAY_CONTAINER_ID" nginx -t
          docker exec "$GATEWAY_CONTAINER_ID" nginx -s reload
          docker exec "$GATEWAY_CONTAINER_ID" wget --no-check-certificate -q -T 10 \
            --header='Host: blog.appzihub.fun' \
            -O /dev/null https://127.0.0.1/api/health/ready
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          EOF

      - name: Verify public readiness
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 "$NEXT_PUBLIC_SERVER_URL/api/health/ready"

      - name: Show remote logs on failure
        if: failure()
        run: |
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/zi-blog}"
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_SSH_USER@$VPS_HOST" "export DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SHA='$DEPLOY_SHA'; bash -s" <<'EOF'
          set -u
          cd "$DEPLOY_PATH/releases/$DEPLOY_SHA"
          docker compose --env-file .env.production -f docker-compose.prod.yml ps --all || true
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color web postgres || true
          docker ps -a --filter 'label=com.docker.compose.project=zi-blog' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          for container_id in $(docker ps -aq --filter 'label=com.docker.compose.project=zi-blog' --filter 'label=com.docker.compose.service=web'); do
            docker inspect -f 'web state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} finished={{.State.FinishedAt}} error={{.State.Error}}' "$container_id" || true
          done
          GATEWAY_CONTAINER_ID="$(docker ps -q --filter 'label=com.docker.compose.project=nginx-gateway' --filter 'label=com.docker.compose.service=nginx' | head -n 1)"
          if [ -n "$GATEWAY_CONTAINER_ID" ]; then
            docker logs --tail 200 "$GATEWAY_CONTAINER_ID" || true
            docker exec "$GATEWAY_CONTAINER_ID" nginx -T 2>&1 | sed -n '/server_name blog\.appzihub\.fun/,/}/p' || true
          fi
          EOF
