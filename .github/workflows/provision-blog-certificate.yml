name: Provision Zi-Blog TLS certificate

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      CERTBOT_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}

    steps:
      - name: Validate certificate configuration
        run: |
          set -euo pipefail
          for name in CERTBOT_EMAIL VPS_HOST VPS_SSH_PRIVATE_KEY VPS_SSH_USER; do
            test -n "${!name}" || { echo "Missing required production secret: $name"; exit 1; }
          done

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VPS_SSH_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -q \
              -P "$VPS_SSH_KEY_PASSPHRASE" \
              -N '' \
              -f ~/.ssh/id_ed25519
          fi
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Trust VPS host key
        run: |
          set -euo pipefail
          if [ -n "$VPS_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Issue certificate on VPS
        run: |
          set -euo pipefail
          ssh -p "${VPS_SSH_PORT:-22}" "$VPS_SSH_USER@$VPS_HOST" "export CERTBOT_EMAIL='$CERTBOT_EMAIL'; bash -s" <<'EOF'
          set -euo pipefail

          GATEWAY_DIR=/opt/nginx-gateway
          cd "$GATEWAY_DIR"
          test -f .env
          mkdir -p certbot/conf certbot/www

          docker run --rm \
            -v "$PWD/certbot/conf:/etc/letsencrypt" \
            -v "$PWD/certbot/www:/var/www/certbot" \
            certbot/certbot:latest certonly \
            --webroot \
            -w /var/www/certbot \
            --cert-name blog-appzihub \
            -d blog.appzihub.fun \
            --email "$CERTBOT_EMAIL" \
            --agree-tos \
            --no-eff-email \
            --non-interactive

          test -s certbot/conf/live/blog-appzihub/fullchain.pem
          test -s certbot/conf/live/blog-appzihub/privkey.pem
          docker compose --env-file .env exec -T nginx nginx -t
          docker compose --env-file .env exec -T nginx nginx -s reload
          EOF
